<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Темы</title>
    <!-- Подключаем библиотеку EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // Инициализация EmailJS вашим публичным ключом
        (function() {
            emailjs.init("qYLyJ2GJrlR2LVAYb"); 
        })();
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 16px; 
            background: #121212; 
            color: #e0e0e0; 
            box-sizing: border-box;
        }
        h2 { font-size: 1.5rem; margin-top: 10px; }
        .input-container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            background: transparent; 
            color: #fff; 
            border: none; 
            outline: none;
            padding: 0; 
            font-size: 1rem;
            resize: vertical; 
            box-sizing: border-box; 
        }
        button { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            margin-top: 10px; 
            width: 100%;
        }
        @media (min-width: 480px) {
            button { width: auto; float: right; }
            .input-container::after { content: ""; display: table; clear: both; }
        }
        .post { 
            background: #1e1e1e; 
            border: 1px solid #333; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 15px; 
            word-break: break-word; 
        }
        .post p { white-space: pre-wrap; margin: 0 0 10px 0; font-size: 0.95rem; line-height: 1.4; }
        .post-footer {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .actions { font-size: 0.85rem; color: #888; display: flex; gap: 15px; }
        .actions span { cursor: pointer; padding: 4px 0; }
        .actions span:hover { color: #fff; }
        .char-count { font-size: 0.8rem; color: #888; text-align: right; margin-top: 6px; }
    </style>
</head>
<body>

    <h2>Мои Темы</h2>
    
    <div class="input-container">
        <textarea id="postInput" placeholder="Что нового? (максимум 200 слов)" oninput="checkWordCount()"></textarea>
        <div class="char-count" id="wordCount">0 / 200 слов</div>
        <button onclick="saveAndSendPost()">Опубликовать</button>
    </div>

    <hr style="border-color: #333; margin: 25px 0; border-width: 0.5px;">

    <div id="postsContainer"></div>

    <script>
        let posts = JSON.parse(localStorage.getItem('static_threads') || '[]');

        function checkWordCount() {
            const text = document.getElementById('postInput').value.trim();
            const words = text ? text.split(/\s+/) : [];
            const count = words.length;
            const counterEl = document.getElementById('wordCount');
            
            counterEl.innerText = `${count} / 200 слов`;
            if (count > 200) {
                counterEl.style.color = '#ff5555';
            } else {
                counterEl.style.color = '#888';
            }
        }

        function saveAndSendPost() {
            const textInput = document.getElementById('postInput');
            const text = textInput.value.trim();
            if (!text) return;

            const words = text.split(/\s+/);
            if (words.length > 200) {
                alert("Превышен лимит в 200 слов.");
                return;
            }

            // 1. Сохраняем локально для ленты на сайте
            const newPost = {
                id: Date.now(),
                text: text,
                date: new Date().toLocaleString()
            };
            posts.unshift(newPost);
            syncStorage();
            renderPosts();

            // 2. Отправляем на почту через EmailJS
            const templateParams = {
                message: text,
                time: newPost.date,
                name: "Daniyar",
                title: text.slice(0, 30) + (text.length > 30 ? '...' : '')
            };

            emailjs.send('service_nm4zntb', 'template_na0vxq9', templateParams)
                .then(function(response) {
                   console.log('Письмо успешно отправлено!', response.status);
                }, function(error) {
                   console.error('Ошибка отправки email:', error);
                   alert('Пост сохранен на сайте, но не удалось отправить email.');
                });

            textInput.value = '';
            checkWordCount();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            if (posts.length === 0) {
                container.innerHTML = '<p style="color: #666;">Пока нет записей.</p>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post">
                    <p>${escapeHTML(post.text)}</p>
                    <div class="post-footer">
                        <span style="font-size: 0.75rem; color: #666;">${post.date}</span>
                        <div class="actions">
                            <span onclick="deletePost(${post.id})" style="color: #ff5555;">Удалить</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function deletePost(id) {
            if (confirm("Вы уверены, что хотите удалить эту запись?")) {
                posts = posts.filter(p => p.id !== id);
                syncStorage();
                renderPosts();
            }
        }

        function syncStorage() {
            localStorage.setItem('static_threads', JSON.stringify(posts));
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderPosts();
    </script>
</body>
</html>
